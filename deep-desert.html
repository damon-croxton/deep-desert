/* Layout: full-bleed WebGL canvas, HUD pinned to the four corners like instrument readouts. */
:root{
  --bg:#0a0705;
  --ink:#f2e4cf;
  --ink-dim:rgba(242,228,207,.58);
  --line:rgba(242,228,207,.16);
  --glass:rgba(18,12,8,.34);
  --spice:#ffad5c;
  --eye:#5aa2ff;
  --display:"Syncopate","Eurostile","Arial Black",sans-serif;
  --body:"Rajdhani","Segoe UI",system-ui,sans-serif;

}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--body)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}

.hud{position:fixed;z-index:2;pointer-events:none;transition:opacity .6s ease}
.hidden-ui .hud{opacity:0}
#title{top:calc(18px + env(safe-area-inset-top,0px));left:20px}
#title .t1{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.62em;text-shadow:0 1px 18px rgba(0,0,0,.45)}
#title .t2{margin-top:6px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-dim)}
#stats{top:calc(18px + env(safe-area-inset-top,0px));right:20px;text-align:right;font-size:12px;letter-spacing:.14em;color:var(--ink-dim);font-variant-numeric:tabular-nums;line-height:1.55;text-transform:uppercase}
#stats b{color:var(--ink);font-weight:600}
#help{left:20px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px 14px;max-width:min(560px,60vw);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
#help span{white-space:nowrap}
#help kbd{font-family:var(--body);font-weight:600;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-right:5px;background:var(--glass)}
#tod{right:20px;bottom:calc(18px + env(safe-area-inset-bottom,0px));pointer-events:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#tod label{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-dim)}
#tod label b{color:var(--spice);font-weight:600;letter-spacing:.2em}
#todRange{-webkit-appearance:none;appearance:none;width:220px;max-width:42vw;height:2px;background:var(--line);outline:none;border-radius:2px}
#todRange::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--spice);box-shadow:0 0 14px var(--spice);cursor:pointer;border:0}
#todRange::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--spice);box-shadow:0 0 14px var(--spice);cursor:pointer;border:0}
#todRange:focus-visible{outline:1px solid var(--spice);outline-offset:6px}
#credits{left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top,0px));font-size:10px;letter-spacing:.12em;color:var(--ink-dim);white-space:nowrap;pointer-events:auto}
#credits a{color:var(--ink-dim);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
#credits a:hover,#credits a:focus-visible{color:var(--ink)}
@media (max-width:1100px){#credits{top:auto;bottom:calc(4px + env(safe-area-inset-bottom,0px));white-space:normal;width:calc(100% - 32px);text-align:center;font-size:9px}#help{bottom:calc(30px + env(safe-area-inset-bottom,0px))}#tod{bottom:calc(30px + env(safe-area-inset-bottom,0px))}}
#stick{position:fixed;z-index:3;width:120px;height:120px;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:none;pointer-events:none}
#stick.on{display:block}
#stick i{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:var(--ink-dim);box-shadow:0 0 18px rgba(0,0,0,.4)}

#toast.on{opacity:.9}

#loader .t{font-family:var(--display);font-weight:700;letter-spacing:.9em;font-size:18px;padding-left:.9em}
#loader .s{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-dim)}
#loader .bar{width:160px;height:1px;background:var(--line);overflow:hidden}
#loader .bar i{display:block;height:100%;width:40%;background:var(--spice);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
#loader.gone{opacity:0;pointer-events:none}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:0 24px;z-index:6;background:var(--bg);font-size:15px;letter-spacing:.08em;line-height:1.6}
@media (max-width:640px){
  #help{display:none}
  #title{left:16px}#stats{right:16px}#tod{right:16px}
  #title .t1{font-size:12px;letter-spacing:.5em}
}
@media (max-width:520px){#stats{display:none}#title .t2{display:none}}
@media (prefers-reduced-motion:reduce){#loader .bar i{animation:none}}

import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================

   ===================================================================== */
const V3 = THREE.Vector3;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* =====================================================================
   Terrain function — bit-identical integer hash in JS and GLSL, so the
   character's feet, the cloth and the GPU mesh all agree on the ground.
   ===================================================================== */
function hash12(x, y) {
  let h = Math.imul(x | 0, 0x8da6b343) ^ Math.imul(y | 0, 0xd8163841);
  h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d);
  h ^= h >>> 12; h = Math.imul(h, 0x297a2d39);
  h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * fx * (fx * (fx * 6 - 15) + 10), uy = fy * fy * fy * (fy * (fy * 6 - 15) + 10);

function duneProfile(u) {
  const p = u - Math.floor(u);
  if (p < 0.72) { const s = p / 0.72; return s * s * (1.5 - 0.5 * s); }
  const t = (p - 0.72) / 0.28; return (1 - t) * (1 - t);

function terrainCore(x, z, detail) {
  const wx = vnoise(x * 0.0035, z * 0.0035) - 0.5;
  const wz = vnoise(x * 0.0035 + 31.7, z * 0.0035 + 11.3) - 0.5;
  const qx = x + wx * 90, qz = z + wz * 160;
  const big = (vnoise(x * 0.0011 + 7.1, z * 0.0011 + 3.3) - 0.5) * 70 + (vnoise(x * 0.0045 + 1.3, z * 0.0045 + 9.9) - 0.5) * 14;
  const amp = 11 * (0.25 + 0.95 * vnoise(qx * 0.005 + 3, qz * 0.005 + 5));
  let h = big + duneProfile(qx / 115 + 0.25 * vnoise(qx * 0.006, qz * 0.006)) * amp;
  if (detail) {
    const rx = qx * 0.8 - qz * 0.6;
    h += duneProfile(rx / 41 + 0.25 * vnoise(qx * 0.01 + 4, qz * 0.01 + 4)) * 3.2 * vnoise(qx * 0.008 + 9, qz * 0.008 + 2);

const CLOUD_ALT = 8500;
function fbm2JS(x, y) { let s = 0, a = 0.5; for (let i = 0; i < 5; i++) { s += a * vnoise(x, y); x = x * 2.07 + 5.3; y = y * 2.07 + 1.7; a *= 0.5; } return s; }
function cloudDensityJS(wx, wz, time, wind, cover) {
  const px = wx * 0.00016 + wind.x * time * 0.002, py = wz * 0.00016 + wind.z * time * 0.002;
  const qx = px * 0.55 + py * 0.15, qy = py * 1.9 - px * 0.35;

}
const terrainLo = (x, z) => terrainCore(x, z, false);
const bigH = (x, z) => (vnoise(x * 0.0011 + 7.1, z * 0.0011 + 3.3) - 0.5) * 70 + (vnoise(x * 0.0045 + 1.3, z * 0.0045 + 9.9) - 0.5) * 14;
function terrainNormal(x, z, e = 0.2) {
  const h0 = terrainH(x, z);
  return new V3(h0 - terrainH(x + e, z), e, h0 - terrainH(x, z + e)).normalize();
}
function duneShadowJS(x, y, z, L) {
  if (L.y <= 0.0) return 0;

  for (let i = 0; i < 22; i++) {
    const qx = x + L.x * t, qy = y + L.y * t, qz = z + L.z * t;
    res = Math.min(res, 10 * (qy - terrainLo(qx, qz)) / t);
    if (res < 0 || qy > 62) break;

  }
  return smooth(0, 1, res);

/* =====================================================================
   GLSL shared chunks
   ===================================================================== */
const NOISE_GLSL = /* glsl */`
float hash12(ivec2 p){
  uint h = (uint(p.x) * 0x8da6b343u) ^ (uint(p.y) * 0xd8163841u);
  h ^= h >> 15u; h *= 0x2c1b3c6du; h ^= h >> 12u; h *= 0x297a2d39u; h ^= h >> 15u;
  return float(h) * 2.3283064365386963e-10;
}
float hash13(ivec3 p){
  uint h = (uint(p.x) * 0x8da6b343u) ^ (uint(p.y) * 0xd8163841u) ^ (uint(p.z) * 0xcb1ab31fu);
  h ^= h >> 15u; h *= 0x2c1b3c6du; h ^= h >> 12u; h *= 0x297a2d39u; h ^= h >> 15u;
  return float(h) * 2.3283064365386963e-10;
}
float vnoise(vec2 x){
  vec2 i = floor(x); vec2 f = x - i;
  vec2 u = f*f*f*(f*(f*6.0-15.0)+10.0);
  ivec2 c = ivec2(i);
  float a = hash12(c), b = hash12(c+ivec2(1,0)), cc = hash12(c+ivec2(0,1)), d = hash12(c+ivec2(1,1));
  return mix(mix(a,b,u.x), mix(cc,d,u.x), u.y);
}
float vnoise3(vec3 x){
  vec3 i = floor(x); vec3 f = x - i; vec3 u = f*f*(3.0-2.0*f); ivec3 c = ivec3(i);
  float a = hash13(c), b = hash13(c+ivec3(1,0,0)), cc = hash13(c+ivec3(0,1,0)), d = hash13(c+ivec3(1,1,0));
  float e = hash13(c+ivec3(0,0,1)), f1 = hash13(c+ivec3(1,0,1)), g = hash13(c+ivec3(0,1,1)), h = hash13(c+ivec3(1,1,1));
  return mix(mix(mix(a,b,u.x), mix(cc,d,u.x), u.y), mix(mix(e,f1,u.x), mix(g,h,u.x), u.y), u.z);
}
float fbm3(vec3 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ s += a*vnoise3(p); p = p*2.03 + vec3(1.7,9.2,3.1); a *= 0.5; } return s; }
float duneProfile(float u){
  float p = fract(u);
  if (p < 0.72){ float s = p/0.72; return s*s*(1.5-0.5*s); }
  float t = (p-0.72)/0.28; return (1.0-t)*(1.0-t);
}
uniform vec4 uWormB; uniform vec2 uWormD;
float wormBulge(vec2 p){
  if (uWormB.z <= 0.0) return 0.0;
  vec2 d = p - uWormB.xy;
  float along = dot(d, uWormD), across = dot(d, vec2(-uWormD.y, uWormD.x));
  float r2 = uWormB.w*uWormB.w;
  float lng = along < 0.0 ? exp(along/320.0) : exp(-along*along/r2);
  return uWormB.z * exp(-across*across/(r2*0.55)) * lng;
}
float terrainCore(vec2 p, out float prof, bool detail){
  float wx = vnoise(p*0.0035) - 0.5;
  float wz = vnoise(p*0.0035 + vec2(31.7, 11.3)) - 0.5;
  vec2 q = p + vec2(wx*90.0, wz*160.0);
  float big = (vnoise(p*0.0011 + vec2(7.1,3.3)) - 0.5)*70.0 + (vnoise(p*0.0045 + vec2(1.3,9.9)) - 0.5)*14.0;

  if (detail){
    float rx = q.x*0.8 - q.y*0.6;
    h += duneProfile(rx/41.0 + 0.25*vnoise(q*0.01 + vec2(4.0)))*3.2*vnoise(q*0.008 + vec2(9.0,2.0));

  }
  return h;

float terrainH(vec2 p){ float pr; return terrainCore(p, pr, true); }
float terrainLo(vec2 p){ float pr; return terrainCore(p, pr, false); }
`;

const CLOUD_GLSL = /* glsl */`
uniform float uCloudCover;
const float CLOUD_ALT = 8500.0;
float fbm2(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ s += a*vnoise(p); p = p*2.07 + vec2(5.3, 1.7); a *= 0.5; } return s; }
float cloudDensity(vec2 w, float time, vec3 wind){
  vec2 p = w*0.00016 + wind.xz*time*0.002;
  vec2 q = vec2(p.x*0.55 + p.y*0.15, p.y*1.9 - p.x*0.35);
  float n = fbm2(vec2(q.x*2.0 + fbm2(q*0.7)*1.4, q.y*2.0));
  float cov = uCloudCover * (0.55 + 0.9*vnoise(p*0.35 + vec2(11.0)));
  return smoothstep(1.0 - cov, 1.0 - cov + 0.28, n);

`;
const HAZE_GLSL = /* glsl */`
uniform vec3 uSunDir;
uniform vec3 uSunColor;
uniform vec3 uZenith;
uniform vec3 uHorizon;
uniform float uHazeDensity;
uniform float uHazeBase;
uniform float uStormAz;
uniform float uStormT;
uniform float uStormGrow;
uniform float uHazeH;
uniform float uTwilight;
float hzN(float x){ float i = floor(x), f = fract(x); f = f*f*(3.0 - 2.0*f);
  return mix(fract(sin(i*127.1)*43758.5453), fract(sin((i + 1.0)*127.1)*43758.5453), f); }
vec3 skyBase(vec3 d){
  float y = d.y;
  float h = max(y, 0.0);
  vec3 c = mix(uZenith, uHorizon, exp(-h*4.2));
  c += uHorizon * 0.1 * exp(-h*1.4);
  float band = exp(-h*12.0);
  c = mix(c, uHorizon*1.1, band*0.5);
  float mu = max(dot(d, uSunDir), 0.0);
  c += uSunColor * (0.05*pow(mu, 3.0) + (0.10 + 0.25*band)*pow(mu, 16.0) + 0.45*pow(mu, 220.0));
  if (y < 0.0) c = mix(c, uHorizon*0.92, clamp(-y*4.0, 0.0, 1.0));
  // twilight: pink anti-solar arch above the planet's own shadow
  if (uTwilight > 0.0){
    vec2 sf = normalize(uSunDir.xz + vec2(1e-5));
    float anti = max(dot(normalize(d.xz + vec2(1e-5)), -sf), 0.0);
    float belt = exp(-pow((h - 0.13)/0.07, 2.0)) * anti*anti;
    float shadowBand = smoothstep(0.1, 0.0, h) * anti;
    c = mix(c, c*vec3(0.62, 0.68, 0.95), shadowBand*0.5*uTwilight);
    c += vec3(1.0, 0.55, 0.62) * belt * 0.18 * uTwilight * dot(uHorizon, vec3(0.33)) * 3.0;
  }
  // a towering dust storm wall on one horizon
  float az = atan(d.x, d.z);
  float da = abs(atan(sin(az - uStormAz), cos(az - uStormAz)));
  float mask = smoothstep(0.62 + 2.8*uStormGrow, 0.3 + 2.8*uStormGrow, da);
  if (mask > 0.0){
    float top = 0.09 + 0.1*hzN(az*7.0 + uStormT*0.015) + 0.045*hzN(az*29.0 - uStormT*0.04) + 0.02*hzN(az*90.0 + uStormT*0.1);
    top *= mask * (1.0 + 2.5*uStormGrow);
    float f = smoothstep(top, top*0.35, max(y, 0.0)) * mask;
    float body = 0.9 + 0.1*hzN(az*23.0 + y*30.0 + uStormT*0.05);
    vec3 storm = uHorizon * vec3(0.62, 0.42, 0.28) * body * (0.7 + 0.3*smoothstep(0.0, top, max(y, 0.0)));
    storm += uSunColor * 0.25 * pow(mu, 3.0) * smoothstep(top*0.5, top, max(y, 0.0));
    c = mix(c, storm, f*0.95);
  }
  return c;
}
vec3 hazeColor(vec3 dir){
  return skyBase(normalize(vec3(dir.x, max(dir.y, 0.0)*mix(0.3, 1.0, uStormGrow) + 0.004, dir.z)));
}
float hazeAmount(vec3 wp, float mul){
  vec3 v = wp - cameraPosition;
  float dist = length(v);
  float d = dist * mul;
  float ya = (cameraPosition.y - uHazeBase) / uHazeH;
  float yb = (wp.y - uHazeBase) / uHazeH;
  float dy = yb - ya;
  float rho = abs(dy) > 1e-3 ? (exp(-ya) - exp(-yb)) / dy : exp(-ya);
  return 1.0 - exp(-uHazeDensity * d * rho);
}
vec3 applyHaze(vec3 col, vec3 wp, float mul){
  vec3 dir = normalize(wp - cameraPosition);
  return mix(col, hazeColor(dir), hazeAmount(wp, mul));
}
`;

const SHADOW_GLSL = /* glsl */`
#include <packing>
uniform sampler2D uShadowMap;
uniform mat4 uShadowMatrix;
uniform float uShadowTexel;
float charShadow(vec3 wp){
  vec4 sc = uShadowMatrix * vec4(wp, 1.0);
  vec3 c = sc.xyz / sc.w;

  const jx = (halton(taaFrame + 1, 2) - 0.5) * 2 / sceneRT.width, jy = (halton(taaFrame + 1, 3) - 0.5) * 2 / sceneRT.height;
  camera.projectionMatrix.elements[8] -= jx; camera.projectionMatrix.elements[9] -= jy;
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
  renderer.setRenderTarget(sceneRT);
  renderer.render(scene, camera);
  // resolve into the full-resolution history
  {
    const T = taaMat.uniforms;
    T.tCur.value = sceneRT.texture; T.tDepth.value = sceneRT.depthTexture; T.tHist.value = taaA.texture;
    T.uJit.value.set(jx * 0.5, jy * 0.5);
    T.uCurTexel.value.set(1 / sceneRT.width, 1 / sceneRT.height);
    T.uHistTexel.value.set(1 / taaA.width, 1 / taaA.height);
    T.uInvVP.value.copy(taa.vp).invert();
    T.uPrevVP.value.copy(taa.prevVP);
    T.uReset.value = taa.reset ? 1 : 0;
    runPass(taaMat, taaB);
    const tmp = taaA; taaA = taaB; taaB = tmp;
    taa.prevVP.copy(taa.vp); taa.reset = false;
  }
  const outTex = taaA.texture;

  // sun screen position for god rays
  const sd = SH.uSunDir.value;
  _sunUV.copy(camera.position).addScaledVector(sd, 1000).project(camera);
  const fwd = new V3(); camera.getWorldDirection(fwd);
  const facing = fwd.dot(sd);
  raysMat.uniforms.uSunUV.value.set(_sunUV.x * 0.5 + 0.5, _sunUV.y * 0.5 + 0.5);
  raysMat.uniforms.uSunVis.value = smooth(0.2, 0.7, facing) * smooth(-0.03, 0.04, sd.y) * (1 - smooth(0.2, 0.7, weather.S));
  raysMat.uniforms.uAspect.value = camera.aspect;
  raysMat.uniforms.tScene.value = outTex; raysMat.uniforms.tDepth.value = sceneRT.depthTexture;
  runPass(raysMat, raysRT);

  // bloom chain
  prefilterMat.uniforms.tSrc.value = outTex;
  prefilterMat.uniforms.uTexel.value.set(1 / taaA.width, 1 / taaA.height);
  runPass(prefilterMat, bloomDown[0]);
  for (let i = 1; i < BLOOM_LEVELS; i++) {
    downMat.uniforms.tSrc.value = bloomDown[i - 1].texture;
    downMat.uniforms.uTexel.value.set(1 / bloomDown[i - 1].width, 1 / bloomDown[i - 1].height);
    runPass(downMat, bloomDown[i]);
  }
  let low = bloomDown[BLOOM_LEVELS - 1];
  for (let i = BLOOM_LEVELS - 2; i >= 0; i--) {
    upMat.uniforms.tLow.value = low.texture; upMat.uniforms.tCur.value = bloomDown[i].texture;
    upMat.uniforms.uTexel.value.set(1 / low.width, 1 / low.height);
    runPass(upMat, bloomUp[i]); low = bloomUp[i];
  }

  // final
  const flat = fwd.clone(); flat.y = 0; flat.normalize();
  const hp = camera.position.clone().addScaledVector(flat, 20000); hp.y = camera.position.y;
  hp.project(camera);
  const U = finalMat.uniforms;
  U.tScene.value = outTex; U.tDepth.value = sceneRT.depthTexture; U.tBloom.value = bloomUp[0].texture; U.tRays.value = raysRT.texture;
  U.uTime.value = t; U.uHorizonY.value = hp.y * 0.5 + 0.5; U.uAspect.value = camera.aspect;
  tod.expSmoothed = damp(tod.expSmoothed ?? tod.exposure, tod.exposure, weather.flash > 0.05 ? 20 : 2, dt);
  U.uExposure.value = tod.expSmoothed;
  const lbTarget = ui.letterbox ? Math.max(0, (1 - (camera.aspect / 2.39)) / 2) : 0;
  U.uLetterbox.value = damp(U.uLetterbox.value, lbTarget, 5, dt);
  U.uHeat.value = (smooth(-2, 12, lerp(68, -14, tod.t)) * 0.9 + 0.1) * (1 - weather.S);
  U.uTexel.value.set(1 / taaA.width, 1 / taaA.height);
  const cineDof = ui.cinematic && clockT - ui.lastLook > 10 ? 1 : 0;
  U.uFocus.value = Math.max(0.5, camera.position.distanceTo(hero.chest()));
  U.uDof.value = damp(U.uDof.value, cineDof * 16 * clamp(44 / camera.fov, 0.7, 1.5) * (taaA.height / 900), 2, dt);
  U.uDofMax.value = 5.5 * (taaA.height / 900);
  U.uSunUVF.value.copy(raysMat.uniforms.uSunUV.value);
  U.uSunVisF.value = raysMat.uniforms.uSunVis.value;
  U.uSunCol.value.copy(SH.uSunColor.value);
  runPass(finalMat, null);
  gpuEnd(gq);
}

function tick(now) {
  requestAnimationFrame(tick);
  let dt = (now - lastNow) / 1000; lastNow = now;
  if (!(dt > 0)) dt = 1 / 60;
  const rawDt = dt;
  dt = Math.min(dt, 1 / 20);
  clockT += dt;
  if (todTarget !== null) {
    const nt = damp(tod.t, todTarget, 1.2, dt);
    applyTimeOfDay(Math.abs(nt - todTarget) < 0.001 ? todTarget : nt);
    todRange.value = tod.t;
    if (tod.t === todTarget) todTarget = null;
  }
  envTimer -= dt;
  if ((envDirty || Math.abs(envBuiltFor - tod.t) > 1e-4) && envTimer <= 0) { updateEnv(); envBuiltFor = tod.t; envDirty = false; envTimer = 0.3; }

  if (!dbgPause.on) { updateWorld(dt, clockT); updateCamera(dt, clockT); }
  else { clockT -= dt; updateCamera(0.0001, clockT); }
  render(dt, clockT);

  // performance governor: lower internal resolution when frames run long
  frame++;
  perf.acc += rawDt; perf.n++;
  if (perf.acc > 0.5) {
    perf.ms = perf.acc / perf.n * 1000; perf.fps = perf.n / perf.acc; perf.acc = 0; perf.n = 0;
    const gs = gpuQ.samples.splice(0);
    if (gs.length) { gs.sort((a, b) => a - b); gpuQ.ms = gs[Math.floor(gs.length * 0.75)]; }
    const maxScale = (QUALITY[qualityIdx].max ?? 1) / renderScale;
    if (frame > 90 && clockT - perf.lastAdj > 1.5) {
      // with GPU timings: aim for ~11 ms of GPU work; otherwise fall back to frame time
      // GPU timings read high when the card idles at low clocks, so they only gate upscaling
      const gpuOk = timerExt && gpuQ.ms > 0;
      const slow = perf.ms > 22 && (!gpuOk || gpuQ.ms > 12);
      const fast = perf.ms < 18.5 && (gpuOk ? gpuQ.ms < 7.5 : perf.ms < 11.5);
      if (slow && adaptiveScale > 0.55) { adaptiveScale = Math.max(0.55, adaptiveScale * (gpuQ.ms > 22 ? 0.8 : 0.9)); perf.lastAdj = clockT; makeTargets(); }
      else if (fast && adaptiveScale < maxScale) { adaptiveScale = Math.min(maxScale, adaptiveScale * 1.07); perf.lastAdj = clockT; makeTargets(); }
    }
    const tris = renderer.info.render.triangles;
    document.getElementById('stats').innerHTML =
      `<b>${perf.fps.toFixed(0)}</b> fps · ${timerExt && gpuQ.ms ? 'gpu ' + gpuQ.ms.toFixed(1) : perf.ms.toFixed(1)} ms<br>${sceneRT.width}×${sceneRT.height} → ${taaA.width}×${taaA.height} TAA · ${QUALITY[qualityIdx].name}<br>${(tris / 1e6).toFixed(2)}M tris · ${renderer.info.render.calls} draws`;
  }
  if (frame === 3) {
    document.getElementById('loader').classList.add('gone');
    setTimeout(() => toast(matchMedia('(pointer: coarse)').matches ? 'Left thumb to walk · drag right side to look' : 'Drag to look · WASD to take control'), 1800);
  }
}

// handle for in-browser inspection (harmless for viewers)
window.__dd = { carryall, convoy2: null, flyby, frigate, convoy, wormRig, thopters, spice, DEVILS, cam, hero, SHOTS, ui, look, applyTimeOfDay, wormState, terrain, plumes, streaks, motes, puffs, footprints, sky, renderer, perf, SH, finalMat, tod, scene, get clockT() { return clockT; }, get sceneRT() { return sceneRT; }, carry, dbgPause, weather, deform, startWorm: (k) => startWorm(k, clockT),
  step(n = 60, dt = 1 / 30) { for (let i = 0; i < n; i++) { clockT += dt; updateWorld(dt, clockT); updateCamera(dt, clockT); } updateEnv(); envBuiltFor = tod.t; envDirty = false; render(dt, clockT); }, setScale(v) { renderScale = v; adaptiveScale = 1; makeTargets(); } };

/* =====================================================================
   Boot
   ===================================================================== */
applyTimeOfDay(parseFloat(todRange.value));
makeTargets();
updateHeightMap(true);
addEventListener('resize', () => makeTargets());
hero.update(1 / 60, { active: false, dir: new V3() }, 0);
cam.target.copy(hero.chest());
updateCamera(1 / 60, 0);
updateEnv(); envDirty = false;
document.getElementById('loadMsg').textContent = 'Compiling shaders';
requestAnimationFrame(() => {
  try { renderer.compile(scene, camera); } catch (e) { /* compile lazily */ }
  requestAnimationFrame(tick);
});
</script>
